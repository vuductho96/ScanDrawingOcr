Global:
  use_gpu: true
  epoch_num: 35
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_cad_v4/
  save_epoch_step: 5
  eval_batch_step: [0, 50]
  cal_metric_during_train: true
  pretrained_model: ./pretrain_models/en_PP-OCRv4_rec_train/best_accuracy
  checkpoints:
  save_inference_dir: ./inference/rec_cad_v4
  use_visualdl: false
  infer_img: ./images/
  character_dict_path: ./synthetic_cad_dataset/cad_dict.txt
  max_text_length: 35
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_cad.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 35

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - ./rec_gt_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gt_label_type: [0, 1]
      - RecAug:
      - CTCLabelEncode:
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_nrtr
            - length
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - ./rec_gt_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gt_label_type: [0, 1]
      - CTCLabelEncode:
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_nrtr
            - length
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 2
